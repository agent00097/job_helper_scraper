apiVersion: v1
kind: ConfigMap
metadata:
  name: jobscraper-config
  namespace: harco
  labels:
    app: jobscraper
data:
  DB_HOST: "app-postgres-rw.infra.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "resume_jobs"
  DB_USER: "resume_user"
  # CloudNativePG in-cluster: prefer TLS; set to disable only if your operator setup requires it
  PGSSLMODE: "prefer"
  # Skill extraction on scrape (writes job_skills). Embeddings need OPENAI_API_KEY secret.
  SKILL_EXTRACTION_ENABLED: "true"
  SKILL_EXTRACTION_EMBEDDINGS: "true"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "jobs"
  # Abandon queue scrape_runs stuck with done < queued (hours + minutes stall).
  SCRAPE_QUEUE_STALE_AFTER_HOURS: "4"
  SCRAPE_QUEUE_STALL_MINUTES: "60"
  # Wall-clock cap per company board scrape (seconds); 0 disables.
  COMPANY_SCRAPE_TIMEOUT_SECONDS: "600"
